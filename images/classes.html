<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .red {
            color: red;
        }
        /* .red is used to apply red color to the text and .is used to call the class */
        #blue {
            color: blue;
        }
        /* #blue is used to apply blue color to the text and # is used to call the id */
    </style>
</head>
<body>
    <p class="red">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Quibusdam, repellendus?</p>
    <p id="blue">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Corrupti, sequi.</p>
    <table>
        <tr>
                <th>Classes and IDs</th>
                <td><iframe width="200" height="150" src="https://www.youtube.com/embed/I7LrS1z_WNA?si=wQgR4QPlJam4ugtK" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></td>
        </tr>
        <tr>
            <th>Head tag</th>
            <td><iframe width="200" height="150" src="https://www.youtube.com/embed/-wMbf3qVNsc?si=fLv6bFSUMvgPorU7" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></td>

        </tr>
    </table>
</body>
<!-- classes and ids are used to target specific elements in the HTML document -->
</html>
