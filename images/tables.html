<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table{
            width: 100%;
            border-collapse: collapse;
            /*border has its own borderline , therefore it looks two line border without using border collapse */
            text-align: center;
        }
        th,td{
            border: 1px solid black;
            padding:8px;
            margin: 0;
        }
        tr:nth-child(even){
            background-color: #906b6b;
            /* tr:nth-child(even) selects every even row and i have selected a specific background color for it */
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>name</th>
            <th>age</th>
            <th>city</th>
            <!-- rowspan and column span can also be used here!
             rowspan="2" takes the space of two rows and
             columnspan="2" takes the space of two columns -->
        </tr>
        <tr>
            <td>John</td>
            <td>25</td>
            <td>New York</td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>30</td>
            <td>Los Angeles</td>
        </tr>
    </table>
</body>
</html>
