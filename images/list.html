<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
</head>
<body>
    <h2>My List</h2>

    <h2>Unordered List</h2>
    <ul style="list-style-type: square;">
        <li>
            1
            <ol type="i">
                <li>H.1</li>
                <li>H.2</li>
            </ol>
            yo</li>
        <li>yoo</li>
        <li>yooo</li>
        <li>yoooo</li>
        <li>yooooo</li>
    </ul>
    <h2>Ordered List</h2>
    <ol type="1">
        <li>yo</li>
        <li>yoo</li>
        <li>yooo</li>
        <li>yoooo</li>
        <li>yooooo</li>
    </ol>
    <dl>
        <dt><span>Ice Cream</span></dt>
        <dd>Chocolate</dd>
        <dt><span>Ice Cream</span></dt>
        <dd>Vanilla</dd>
    </dl>
    <!-- inline elements are those whose display property is set to inline whereas block elements are those whose display property is set to block who covers the whole screen upto the end -->
</body>
</html>
