<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <style>
        body{
            background-color: #414141;
            color: white;
        }
    </style>
</head>
<body>
    <form action="" method="post" accept-charset="utf-8" autocomplete="off" enctype="application/x-www-form-urlencoded" name="form" target="_self">
        <label for="name">name</label>
        <input type="text" name="name" placeholder="enter your name" id="name" required><br>
        
        <label for="email">Email</label>
        <input type="email" name="email" placeholder="enter your email" id="email" required><br>
        
        <button type="submit">Submit</button>

    </form>

</body>
</html>
